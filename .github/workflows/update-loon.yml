name: 更新 Loon 规则

on:
  schedule:
    - cron: "30 20 * * *"   # 每天北京时间 04:30（比 QX 那套晚 30 分钟，避免同时推送冲突）
  workflow_dispatch:        # 允许在网页上手动运行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 转换规则（Loon 格式）
        run: python convert_loon.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add loon
          if git diff --cached --quiet; then
            echo "规则没有变化"
            exit 0
          fi
          git commit -m "更新 Loon 规则 $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
          # 刷新 jsDelivr 缓存，让 Loon 尽快拿到新规则
          for f in loon/*.list; do
            curl -s "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f" > /dev/null || true
          done
